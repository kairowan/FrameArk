name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository content
        run: |
          python scripts/check_repository.py --repo .
          python -m unittest discover -s scripts -p 'test_*.py'

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Detect Rust workspace
        id: detect
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Rust workspace not present yet; check is intentionally a no-op."
          fi
      - name: Install Rust components
        if: steps.detect.outputs.present == 'true'
        run: rustup component add rustfmt clippy
      - name: Check formatting
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Run Clippy
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace --all-features --locked
      - name: Build Rust documentation
        if: steps.detect.outputs.present == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  runtime:
    name: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build reference receiver
        run: cargo build -p framearkd --locked
      - name: Start reference receiver and verify listener smoke
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 8s target/debug/framearkd \
            --bind 127.0.0.1:0 \
            --server-name localhost \
            --pairing-code 123456
          status=$?
          if [[ "$status" -ne 124 ]]; then
            echo "framearkd did not remain alive through the runtime smoke window (status=$status)"
            exit "$status"
          fi

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Detect Android build
        id: detect
        shell: bash
        run: |
          if [[ -f gradlew ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Android build not present yet; check is intentionally a no-op."
          fi
      - name: Set up Java
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          verify-signature: true
      - name: Build Rust JNI bridge
        if: steps.detect.outputs.present == 'true'
        run: bash scripts/build_android_native.sh
      - name: Run Android lint and unit tests
        if: steps.detect.outputs.present == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lint test assembleDebug :receiver:assembleDebugAndroidTest :sender:assembleDebugAndroidTest
      - name: Verify JNI library is packaged
        if: steps.detect.outputs.present == 'true'
        run: |
          python scripts/verify_android_native_package.py --apk apps/android/receiver/build/outputs/apk/debug/receiver-debug.apk
          python scripts/verify_android_native_package.py --apk apps/android/sender/build/outputs/apk/debug/sender-debug.apk
      - name: Compile isolated screen-capture fixtures
        if: steps.detect.outputs.present == 'true'
        run: ./gradlew --no-daemon -PframearkPlaybackProbe=true :sender:compileDebugKotlin :sender:compileDebugAndroidTestKotlin :receiver:compileDebugAndroidTestKotlin
      - name: Exercise production dual-APK release signing with disposable fixture key
        if: steps.detect.outputs.present == 'true'
        run: |
          sdkmanager 'build-tools;35.0.0'
          ./gradlew --no-daemon assembleRelease -PframearkVersionName=0.0.0-ci -PframearkVersionCode=2
          python scripts/android_release_smoke.py --sdk-tools "$ANDROID_HOME/build-tools/35.0.0"

  platform:
    name: platform-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run cross-platform Rust tests
        run: cargo test --workspace --all-features --locked
      - name: Build reference receiver
        run: cargo build -p framearkd --locked
      - name: Run reference receiver startup smoke
        run: python scripts/platform_runtime_smoke.py --binary target/debug/framearkd --wait-seconds 3

  gate:
    name: ci-gate
    if: always()
    needs:
      - repository
      - rust
      - runtime
      - android
      - platform
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "$REPOSITORY_RESULT" = "success"
          test "$RUST_RESULT" = "success"
          test "$RUNTIME_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
          test "$PLATFORM_RESULT" = "success"
