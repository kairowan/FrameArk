name: Bug report
description: Report a reproducible FrameArk defect without sensitive data
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve FrameArk. Do not include credentials, private media, device keys, pairing tokens, or unsanitized packet captures. Report security vulnerabilities through the private channel in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: FrameArk version or commit
      description: Provide the release version or full commit SHA.
      placeholder: v0.1.0 or 0123456789abcdef...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Rust core or daemon
        - Android Receiver
        - Android Sender
        - Desktop Receiver
        - Desktop Sender
        - Web Sender or gateway
        - CLI, SDK, or protocol lab
        - CI, documentation, or packaging
        - Unknown
    validations:
      required: true
  - type: input
    id: protocol
    attributes:
      label: Protocol or media mode
      placeholder: FANP, DLNA, RAOP, AirPlay mirroring, H.264 + Opus, or not applicable
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include sender/receiver model, OS version, network type, codec, resolution, and relevant hardware capabilities.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide a minimal, repeatable sequence.
      placeholder: |
        1. Start ...
        2. Connect ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste redacted logs or attach a FrameArk diagnostic bundle. Remove private URLs, tokens, identifiers, and media.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: This report does not contain a security vulnerability or sensitive information.
          required: true
        - label: I can help test a fix or provide additional sanitized diagnostics.
          required: false

