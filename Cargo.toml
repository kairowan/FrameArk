[workspace]
members = [
    "crates/frameark-api",
    "crates/frameark-core",
    "crates/frameark-discovery",
    "crates/frameark-dlna",
    "crates/frameark-airplay",
    "crates/frameark-ffi",
    "crates/frameark-media",
    "crates/frameark-native",
    "crates/frameark-transport",
    "crates/frameark-trust",
    "tools/frameark-cli",
]
resolver = "3"

[workspace.package]
authors = ["FrameArk contributors"]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kairowan/FrameArk"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
frameark-core = { path = "crates/frameark-core" }
mdns-sd = { version = "0.21.5", default-features = false }
jni = "0.21.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"
